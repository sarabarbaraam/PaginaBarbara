<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Equipo</title>
    <link rel="stylesheet" href="assets/styles/variables.css">
</head>
<body>
    <header>
        <div class="logo">LOGO</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Cursos</a>
            <a href="#">Ayuda</a>
            <a href="#">Perfil</a>
            <input type="text" placeholder="Buscar">
        </nav>
        <div class="perfil">KC</div>
    </header>

    <div class="container">
        <aside>
            <ul>
                <li>Material</li>
                <li>Proveedores</li>
                <li>Departamentos</li>
                <li>Directorio</li>
                <li>Formación</li>
                <li>Configuración</li>
            </ul>
        </aside>
        <main>
            <form class="detalle-form">
                <div class="imagen-equipo">
                    <img src="assets/images/pc1.png" alt="Equipo">
                </div>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" value="Portátil Lenovo Thinkpad">
                </div>
                <div class="form-group">
                    <label>Etiqueta</label>
                    <input type="text" value="E0001">
                </div>
                <div class="form-group">
                    <label>N° de serie</label>
                    <input type="text" value="123456789">
                </div>
                <div class="form-group">
                    <label>Departamento</label>
                    <input type="text" value="Dpto. Desarrollo">
                </div>
                <div class="form-group">
                    <label>Fecha de adquisición</label>
                    <input type="date" value="2023-01-01">
                </div>
                <div class="form-group">
                    <label>Proveedor</label>
                    <input type="text" value="Proveedor S.A.">
                </div>
                <div class="form-group">
                    <label>Ubicación</label>
                    <input type="text" value="Oficina 1">
                </div>
                <div class="form-group">
                    <label>Marca / Fabricante</label>
                    <input type="text" value="Lenovo">
                </div>
                <div class="form-group">
                    <label>Precio / Coste</label>
                    <input type="text" value="$1,200">
                </div>
                <div class="form-group">
                    <input type="checkbox" checked> Garantía
                    <input type="checkbox"> En reparación
                </div>
                <div class="form-group">
                    <label>Notas</label>
                    <textarea rows="4">Lorem ipsum dolor sit amet, consectetur adipiscing elit...</textarea>
                </div>
                <div class="form-group">
                    <label>Enlaces de interés</label>
                    <input type="text" value="http://example.com/products/link">
                </div>
                <div class="botones">
                    <button class="cancelar">Cancelar</button>
                    <button class="guardar">Guardar</button>
                </div>
            </form>
        </main>
    </div>
    <footer>
        <p>2025 KeepCoding</p>
        <p>
            <a href="#">Privacidad</a> | 
            <a href="#">FAQs</a> | 
            <a href="#">Contactar</a>
        </p>
    </footer>
    
</body>
</html>
